name: Lint

on: pull_request

jobs:
  lint:
    runs-on: [craci, cpu=4, ram=16, disk=40, image=ubuntu-latest]

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20.x

      - name: Install and lint
        run: |
          yarn install
          yarn test:other
          yarn test:code
          yarn test:typecheck
